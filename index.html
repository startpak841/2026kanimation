<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="theme-color" content="#0D6E4F" />
  <title>2026 K-Animation Global Showcase</title>

  <!-- Pretendard Variable (본문 · 한글/영문 통합) -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css" />

  <!-- Noto Sans KR (보조 · 한글 무게감) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Geist Mono (모노스페이스) -->
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <style>
    html, body, #root { height: 100%; margin: 0; padding: 0; }
    body {
      font-family: 'Pretendard Variable', Pretendard, 'Noto Sans KR', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background: #FAFAF7;
      color: #18181B;
      /* iOS 노치 대응 */
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    /* 모바일에서 글자 자동 확대 방지 */
    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }

    /* 입력 시 자동 줌 방지 (iOS) — 입력 폰트 16px 이상 보장 */
    input, select, textarea, button { font-size: 16px; font-family: inherit; }

    /* 터치 친화적 최소 크기 */
    button, .btn, [role="button"] { min-height: 36px; }

    /* 가로 스크롤 방지 */
    body { overflow-x: hidden; }

    /* 모바일 (≤767px) */
    @media (max-width: 767px) {
      /* 본문 글자 약간 키움 */
      body { font-size: 14px; }

      /* 헤더 padding 줄임 */
      [data-mobile-pad] { padding-left: 16px !important; padding-right: 16px !important; }

      /* 큰 padding 클래스 모바일에서 축소 */
      .mobile-shrink-pad { padding: 16px !important; }

      /* 데스크톱 전용 표시 - 숨김 */
      .desktop-only { display: none !important; }

      /* 모바일 전용 표시 */
      .mobile-only { display: block !important; }

      /* 그리드 1열로 강제 */
      .auto-mobile-1col { grid-template-columns: 1fr !important; }

      /* 테이블 가로 스크롤 컨테이너 */
      .mice-table-wrap, .table-scroll {
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
      }

      /* 모달 풀스크린 */
      .modal-fullscreen-mobile {
        width: 100vw !important;
        max-width: 100vw !important;
        height: 100vh !important;
        max-height: 100vh !important;
        border-radius: 0 !important;
      }

      /* 큰 글자 사이즈 다운 */
      h1 { font-size: 24px !important; }
      h2 { font-size: 20px !important; }
      h3 { font-size: 17px !important; }

      /* 메인 컨테이너 padding 축소 */
      main, .main-container {
        padding-left: 16px !important;
        padding-right: 16px !important;
      }

      /* 폼 라벨 약간 키움 */
      label, .label { font-size: 12.5px !important; }

      /* 버튼 padding 적정화 */
      .btn { padding: 9px 14px !important; }

      /* 카드 padding 축소 */
      [data-card] { padding: 14px !important; }
    }

    /* 매우 작은 화면 (≤380px - 작은 폰) */
    @media (max-width: 380px) {
      body { font-size: 13.5px; }
      h1 { font-size: 20px !important; }
      h2 { font-size: 17px !important; }
      .btn { padding: 8px 12px !important; font-size: 12.5px !important; }
      main, .main-container {
        padding-left: 12px !important;
        padding-right: 12px !important;
      }
    }

    /* 데스크톱 전용 클래스는 모바일에서만 숨김 — 기본은 보임 */
    .mobile-only { display: none; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
